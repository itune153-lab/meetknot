<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2230" />
  <title>MeetKNOT.Ai</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ① 시작(로딩) 화면 -->
  <div id="splash"><canvas id="sand"></canvas></div>

  <!-- 페이지 바뀔 때 가운데 번쩍 아이콘 -->
  <div id="flash" class="hidden"><img alt="" /></div>

  <!-- AI 요약 중 표시 -->
  <div id="aiBusy" class="ai-busy hidden">
    <img src="img/ICON_AI.png" alt="" />
    <p>AI가 회의를 요약하고 있어요…<br /><small>회의가 길면 1분쯤 걸릴 수 있어요.</small></p>
  </div>

  <!-- 질문 창 -->
  <div id="modal" class="modal hidden">
    <div class="m-box">
      <div class="m-title"></div>
      <div class="m-msg"></div>
      <div class="m-btns"></div>
    </div>
  </div>

  <div id="app">
    <!-- 카카오톡 등 앱 안 브라우저 안내 -->
    <div id="inapp" class="banner hidden">
      카카오톡 안에서는 녹음이 잘 안 돼요.
      <a id="openChrome" href="#">크롬으로 열기</a>
    </div>

    <header class="top">
      <span class="brand">MeetKNOT.Ai</span>
    </header>

    <!-- ② 홈 화면 -->
    <section id="page-home" class="view">
      <div class="stage">
        <img class="hi" data-go="meeting" src="img/ICON_MEETING.png" alt="회의 시작"
             style="--x:27%;--y:15%;--fx:-120vw;--fy:-40vh;--fr:-200deg;--d:0s" />
        <img class="hi" data-go="ai" src="img/ICON_AI.png" alt="AI 요약 목록"
             style="--x:74%;--y:14%;--fx:120vw;--fy:-50vh;--fr:220deg;--d:.12s" />
        <img class="hi" data-go="pdf" src="img/ICON_PDFList.png" alt="PDF 목록"
             style="--x:77%;--y:36%;--fx:130vw;--fy:0vh;--fr:180deg;--d:.24s" />
        <img class="hi" data-go="notes" src="img/ICON_NOTES.png" alt="회의 목록"
             style="--x:74%;--y:58%;--fx:120vw;--fy:40vh;--fr:-220deg;--d:.36s" />
        <img class="hi" data-go="setting" src="img/ICON_SETTING.png" alt="설정"
             style="--x:77%;--y:80%;--fx:-60vw;--fy:70vh;--fr:240deg;--d:.48s" />

        <div class="pitch">
          <h1>MeetKNOT<span>.Ai</span></h1>
          <p id="pitch"></p>
        </div>
      </div>
    </section>

    <!-- ③ 회의준비 화면 -->
    <section id="page-prep" class="view hidden">
      <main class="page">
        <section class="meta">
          <input id="pTitle" class="title" type="text" placeholder="회의 제목 입력 (비우면 날짜·시간)" />
          <div id="pNow" class="now"></div>
        </section>
        <label class="row"><span>회의 장소</span><input id="pPlace" type="text" placeholder="회의 장소 입력" /></label>
        <div>
          <div class="lbl">참석자 선택</div>
          <div id="pPeople" class="chips"></div>
        </div>
        <div class="card">
          <div class="box-label">안건 / 소제목</div>
          <textarea id="pAgenda" rows="6" placeholder="오늘의 회의 안건&#10;1.&#10;2.&#10;3."></textarea>
        </div>
        <button id="pStart" class="start-btn" aria-label="회의 시작">
          <img src="img/ICON_MEETING.png" alt="" />
          <span>눌러서 회의 시작</span>
        </button>
      </main>
    </section>

    <!-- ④ 본 회의 화면 -->
    <section id="page-meeting" class="view hidden">
      <main class="page">
        <section class="meta">
          <input id="title" class="title" type="text" placeholder="회의 제목 입력" />
          <div id="now" class="now"></div>
          <div id="mInfo" class="now"></div>
        </section>

        <div id="mAgendaBox" class="agenda-mini hidden"><b>안건</b><div id="mAgenda"></div></div>

        <section class="rec-area">
          <div class="rec-left">
            <button id="recBtn" class="rec-btn" aria-label="녹음 시작">
              <img id="recImg" src="img/ICON_REC1.png" alt="" />
            </button>
            <div id="recHint" class="rec-hint">녹음 버튼을 누르면<br />자동 입력됩니다.</div>
            <div id="timer" class="timer hidden">00:00</div>
          </div>
          <div class="live">
            <div class="box-label">자동 입력 뷰프레임</div>
            <div id="liveText" class="live-text"><span class="final"></span><span class="interim"></span></div>
          </div>
        </section>

        <div id="status" class="status"></div>
        <div id="diag" class="diag"></div>

        <section class="block">
          <div class="bar">단락 저장 (<span id="count">0</span>개)</div>
          <div id="paras" class="paras"><div class="empty">단락 내용</div></div>
        </section>

        <section class="block">
          <div class="bar">직접 입력</div>
          <div class="direct">
            <textarea id="direct" rows="3" placeholder="여기에 글을 쓰고 '단락 추가'를 누르세요."></textarea>
            <button id="addDirect" class="btn">단락 추가</button>
          </div>
        </section>

        <button id="saveMeeting" class="save-btn">회의 저장하고 마치기</button>
      </main>
    </section>

    <!-- ⑤ 회의 목록 -->
    <section id="page-notes" class="view hidden">
      <main class="page">
        <div id="noteListWrap">
          <h2 class="ptitle">회의 목록</h2>
          <div id="noteList" class="note-list"></div>
        </div>
        <div id="noteDetail" class="detail hidden">
          <div class="d-top"><button id="noteBack" class="btn ghost">← 목록</button><span><button class="btn d-ai">AI 요약</button> <button class="btn danger d-del">삭제</button></span></div>
          <div class="d-body"></div>
        </div>
      </main>
    </section>

    <!-- ⑥ 아직 만들지 않은 화면들 -->
    <!-- ⑥ AI 요약 목록 -->
    <section id="page-ai" class="view hidden">
      <main class="page">
        <div id="sumListWrap">
          <h2 class="ptitle">AI 요약 목록</h2>
          <div id="sumList" class="note-list"></div>
        </div>
        <div id="sumDetail" class="detail hidden">
          <div class="d-top"><button id="sumBack" class="btn ghost">← 목록</button>
            <span><button class="btn d-copy">복사</button> <button class="btn danger d-del">삭제</button></span></div>
          <div class="d-body"></div>
        </div>
      </main>
    </section>
    <section id="page-pdf" class="view hidden"><div class="soon"><img src="img/ICON_PDFList.png" alt="" /><p>PDF 목록은 다음 단계에서 만들어요.</p></div></section>
    <!-- ⑦ 설정 -->
    <section id="page-setting" class="view hidden">
      <main class="page">
        <h2 class="ptitle">설정</h2>

        <div class="set-card">
          <div class="set-h">Gemini API 키</div>
          <div class="set-row">
            <input id="keyInput" type="password" placeholder="AIza로 시작하는 키를 붙여넣으세요" autocomplete="off" />
            <button id="keyShow" class="btn ghost">보기</button>
          </div>
          <button id="keySave" class="btn">저장하고 확인</button>
          <div id="keyMsg" class="set-msg"></div>
          <div class="set-help">키는 이 기기에만 저장돼요. 키 받는 곳:
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a></div>
        </div>

        <div class="set-card">
          <div class="set-h">참석자 명단</div>
          <div id="peopleList" class="people-list"></div>
          <div class="set-row">
            <input id="personInput" type="text" placeholder="이름 입력" />
            <button id="personAdd" class="btn">추가</button>
          </div>
        </div>

        <div class="set-card">
          <div class="set-h">테마</div>
          <div id="themes" class="themes">
            <button data-theme="wall"><i class="sw wall"></i>기본</button>
            <button data-theme="dark"><i class="sw dark"></i>어둡게</button>
            <button data-theme="light"><i class="sw light"></i>밝게</button>
          </div>
        </div>
      </main>
    </section>

    <nav class="nav">
      <button data-go="home" class="on"><img src="img/HOME.png" alt="홈" /></button>
      <button data-go="meeting"><img src="img/MEETING.png" alt="회의" /></button>
      <button data-go="notes"><img src="img/NOTES.png" alt="회의 목록" /></button>
      <button data-go="ai"><img src="img/AI.png" alt="AI 요약" /></button>
      <button data-go="pdf"><img src="img/PDFList.png" alt="PDF 목록" /></button>
      <button data-go="setting"><img src="img/SETTING.png" alt="설정" /></button>
    </nav>
  </div>

  <script src="js/store.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/home.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
