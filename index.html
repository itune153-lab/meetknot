<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2230" />
  <title>MeetKNOT.Ai</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ① 시작(로딩) 화면 -->
  <div id="splash"><canvas id="sand"></canvas></div>

  <!-- 페이지 바뀔 때 가운데 번쩍 아이콘 -->
  <div id="flash" class="hidden"><img alt="" /></div>

  <div id="app">
    <!-- 카카오톡 등 앱 안 브라우저 안내 -->
    <div id="inapp" class="banner hidden">
      카카오톡 안에서는 녹음이 잘 안 돼요.
      <a id="openChrome" href="#">크롬으로 열기</a>
    </div>

    <header class="top">
      <span class="brand">MeetKNOT.Ai</span>
    </header>

    <!-- ② 홈 화면 -->
    <section id="page-home" class="view">
      <div class="stage">
        <img class="hi" data-go="meeting" src="img/ICON_MEETING.png" alt="회의 시작"
             style="--x:27%;--y:15%;--fx:-120vw;--fy:-40vh;--fr:-200deg;--d:0s" />
        <img class="hi" data-go="ai" src="img/ICON_AI.png" alt="AI 요약 목록"
             style="--x:74%;--y:14%;--fx:120vw;--fy:-50vh;--fr:220deg;--d:.12s" />
        <img class="hi" data-go="pdf" src="img/ICON_PDFList.png" alt="PDF 목록"
             style="--x:77%;--y:36%;--fx:130vw;--fy:0vh;--fr:180deg;--d:.24s" />
        <img class="hi" data-go="notes" src="img/ICON_NOTES.png" alt="회의 목록"
             style="--x:74%;--y:58%;--fx:120vw;--fy:40vh;--fr:-220deg;--d:.36s" />
        <img class="hi" data-go="setting" src="img/ICON_SETTING.png" alt="설정"
             style="--x:77%;--y:80%;--fx:-60vw;--fy:70vh;--fr:240deg;--d:.48s" />

        <div class="pitch">
          <h1>MeetKNOT<span>.Ai</span></h1>
          <p id="pitch"></p>
        </div>
      </div>
    </section>

    <!-- ③ 회의 화면 (1단계에서 만든 녹음 화면) -->
    <section id="page-meeting" class="view hidden">
      <main class="page">
        <section class="meta">
          <input id="title" class="title" type="text" placeholder="회의 제목 입력" />
          <div id="now" class="now"></div>
        </section>

        <section class="rec-area">
          <div class="rec-left">
            <button id="recBtn" class="rec-btn" aria-label="녹음 시작">
              <img id="recImg" src="img/ICON_REC1.png" alt="" />
            </button>
            <div id="recHint" class="rec-hint">녹음 버튼을 누르면<br />자동 입력됩니다.</div>
            <div id="timer" class="timer hidden">00:00</div>
          </div>
          <div class="live">
            <div class="box-label">자동 입력 뷰프레임</div>
            <div id="liveText" class="live-text"><span class="final"></span><span class="interim"></span></div>
          </div>
        </section>

        <div id="status" class="status"></div>

        <section class="block">
          <div class="bar">단락 저장 (<span id="count">0</span>개)</div>
          <div id="paras" class="paras"><div class="empty">단락 내용</div></div>
        </section>

        <section class="block">
          <div class="bar">직접 입력</div>
          <div class="direct">
            <textarea id="direct" rows="3" placeholder="여기에 글을 쓰고 '단락 추가'를 누르세요."></textarea>
            <button id="addDirect" class="btn">단락 추가</button>
          </div>
        </section>
      </main>
    </section>

    <!-- ④ 아직 만들지 않은 화면들 -->
    <section id="page-notes" class="view hidden"><div class="soon"><img src="img/ICON_NOTES.png" alt="" /><p>회의 목록은 다음 단계에서 만들어요.</p></div></section>
    <section id="page-ai" class="view hidden"><div class="soon"><img src="img/ICON_AI.png" alt="" /><p>AI 요약 목록은 다음 단계에서 만들어요.</p></div></section>
    <section id="page-pdf" class="view hidden"><div class="soon"><img src="img/ICON_PDFList.png" alt="" /><p>PDF 목록은 다음 단계에서 만들어요.</p></div></section>
    <section id="page-setting" class="view hidden"><div class="soon"><img src="img/ICON_SETTING.png" alt="" /><p>설정은 다음 단계에서 만들어요.</p></div></section>

    <nav class="nav">
      <button data-go="home" class="on"><img src="img/HOME.png" alt="홈" /></button>
      <button data-go="meeting"><img src="img/MEETING.png" alt="회의" /></button>
      <button data-go="notes"><img src="img/NOTES.png" alt="회의 목록" /></button>
      <button data-go="ai"><img src="img/AI.png" alt="AI 요약" /></button>
      <button data-go="pdf"><img src="img/PDFList.png" alt="PDF 목록" /></button>
      <button data-go="setting"><img src="img/SETTING.png" alt="설정" /></button>
    </nav>
  </div>

  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
